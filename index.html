<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Simulador de Ponto Cruz</title>
<style>
  :root {
    --bg: #1c1e26;
    --panel: #252833;
    --panel-2: #2e313e;
    --border: #3a3e4d;
    --text: #e6e8ef;
    --muted: #9aa0b4;
    --accent: #7c9cff;
    --accent-strong: #5b7cff;
    --danger: #ff6b6b;
    --fabric: #f3ede0;
  }
  * { box-sizing: border-box; }
  html, body {
    margin: 0; height: 100%;
    font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", system-ui, sans-serif;
    background: var(--bg); color: var(--text);
    overflow: hidden;
    -webkit-font-smoothing: antialiased;
  }
  #app { display: flex; flex-direction: column; height: 100%; }

  /* ---- Top bar ---- */
  header {
    display: flex; align-items: center; gap: 14px;
    padding: 8px 14px; background: var(--panel);
    border-bottom: 1px solid var(--border);
    flex-wrap: wrap;
  }
  header h1 {
    font-size: 15px; font-weight: 600; margin: 0;
    display: flex; align-items: center; gap: 8px; white-space: nowrap;
  }
  header h1 .logo { font-size: 18px; }
  header h1 .brand {
    font-size: 17px; font-weight: 800; letter-spacing: .3px;
    background: linear-gradient(120deg, #7c9cff 0%, #ec407a 100%);
    -webkit-background-clip: text; background-clip: text; color: transparent;
  }
  .group {
    display: flex; align-items: center; gap: 4px;
    padding: 3px; background: var(--panel-2);
    border: 1px solid var(--border); border-radius: 10px;
  }
  .group .label {
    font-size: 10px; color: var(--muted); text-transform: uppercase;
    letter-spacing: .5px; padding: 0 6px; white-space: nowrap;
  }
  button.tool, button.plain {
    display: inline-flex; align-items: center; justify-content: center; gap: 6px;
    min-width: 34px; height: 32px; padding: 0 8px;
    background: transparent; color: var(--text);
    border: 1px solid transparent; border-radius: 7px;
    font-size: 13px; cursor: pointer; transition: background .12s, border-color .12s;
    white-space: nowrap;
  }
  button.tool svg, button.plain svg { pointer-events: none; }
  button.tool:hover, button.plain:hover { background: var(--panel); }
  button.tool.active {
    background: var(--accent-strong); color: #fff;
    box-shadow: 0 1px 0 rgba(0,0,0,.2) inset;
  }
  button.tool.disabled { opacity: .3; pointer-events: none; }
  button.plain.subtle { color: var(--muted); }
  button.plain.active { background: var(--accent-strong); color: #fff; }
  .seg-toggle { padding: 3px; gap: 2px; }
  .seg-btn {
    height: 30px; padding: 0 12px; border-radius: 7px; border: 1px solid transparent;
    background: transparent; color: var(--muted); font-size: 13px; cursor: pointer;
    white-space: nowrap; transition: background .12s, color .12s;
  }
  .seg-btn:hover { color: var(--text); }
  .seg-btn.active { background: var(--accent-strong); color: #fff; }
  .spacer { flex: 1; }
  .zoomval { font-size: 12px; color: var(--muted); min-width: 42px; text-align: center; }
  button.plain.icon-only { width: 32px; min-width: 32px; padding: 0; }
  button.plain.icon-only svg { width: 17px; height: 17px; stroke: currentColor; fill: none; stroke-width: 1.8; stroke-linecap: round; stroke-linejoin: round; }

  /* ---- Body ---- */
  #body { display: flex; flex: 1; min-height: 0; }

  /* ---- Vertical toolbar ---- */
  #toolbar {
    width: 40px; background: transparent;
    display: flex; flex-direction: column; align-items: center; gap: 4px; padding: 8px 3px;
    flex: 0 0 auto; position: relative; z-index: 5;
  }
  #toolbar button {
    position: relative;
    width: 34px; height: 34px; display: flex; align-items: center; justify-content: center;
    background: transparent; border: 1px solid transparent; border-radius: 8px;
    color: #cfd3e0; cursor: pointer; transition: background .12s, color .12s;
  }
  #toolbar button:hover { background: rgba(255,255,255,.08); color: #fff; }
  #toolbar button::after {
    content: attr(data-tip);
    position: absolute; left: 42px; top: 50%; transform: translateY(-50%);
    background: rgba(18,20,28,.97); color: var(--text); border: 1px solid var(--border);
    padding: 4px 9px; border-radius: 6px; font-size: 12px; white-space: nowrap;
    opacity: 0; pointer-events: none; transition: opacity .1s .05s; z-index: 60;
    box-shadow: 0 4px 14px rgba(0,0,0,.4);
  }
  #toolbar button:hover::after { opacity: 1; }
  #toolbar button.active { background: var(--accent-strong); color: #fff; }
  #toolbar button.disabled { opacity: .28; pointer-events: none; }
  #toolbar svg { width: 19px; height: 19px; stroke: currentColor; fill: none; stroke-width: 1.7; stroke-linecap: round; stroke-linejoin: round; }
  #toolbar .sep { width: 22px; height: 1px; background: var(--border); margin: 4px 0; }

  /* ---- Left palette ---- */
  aside {
    width: 214px; background: var(--panel); border-right: 1px solid var(--border);
    display: flex; flex-direction: column; min-height: 0;
  }
  .aside-section { padding: 12px; border-bottom: 1px solid var(--border); }
  .palette-section { flex: 0 0 auto; height: 150px; display: flex; flex-direction: column; overflow: hidden; border-bottom: none; }
  .palette-section .swatches { flex: 1; max-height: none; }
  .stitch-section { flex: 1; overflow: hidden; display: flex; flex-direction: column; }
  #paletteResizer { height: 8px; flex: 0 0 auto; cursor: row-resize; display: flex; align-items: center; justify-content: center; }
  #paletteResizer::before { content: ""; width: 34px; height: 3px; border-radius: 2px; background: var(--border); }
  #paletteResizer:hover::before { background: var(--accent-strong); }
  #asideResizer { width: 5px; flex: 0 0 auto; cursor: col-resize; background: transparent; }
  #asideResizer:hover { background: var(--accent-strong); }
  .aside-section h2 {
    font-size: 11px; text-transform: uppercase; letter-spacing: .6px;
    color: var(--muted); margin: 0 0 8px;
  }
  .current-color { display: flex; align-items: center; gap: 10px; }
  .current-swatch {
    width: 40px; height: 40px; border-radius: 8px; flex: 0 0 auto;
    border: 2px solid var(--border); box-shadow: 0 2px 6px rgba(0,0,0,.3);
    position: relative; overflow: hidden; cursor: pointer;
  }
  .current-swatch.sm { width: 28px; height: 28px; box-shadow: none; }
  .current-swatch input[type=color] {
    position: absolute; inset: -6px; width: 150%; height: 150%;
    padding: 0; border: none; background: none; cursor: pointer;
  }
  .hex-input {
    flex: 1; min-width: 0; height: 34px; background: var(--panel-2); color: var(--text);
    border: 1px solid var(--border); border-radius: 7px; padding: 0 8px;
    font-size: 13px; font-family: inherit; text-transform: uppercase; letter-spacing: .3px;
  }
  .bg-row { display: flex; align-items: center; gap: 10px; margin-top: 9px; }
  .bg-label { font-size: 12px; color: var(--muted); }
  .swatches {
    display: grid; grid-template-columns: repeat(auto-fill, 28px); gap: 6px;
    justify-content: start; align-content: start;
    max-height: 180px; overflow-y: auto; padding-right: 2px;
  }
  .swatch {
    width: 28px; height: 28px; border-radius: 6px; cursor: pointer;
    border: 2px solid rgba(255,255,255,.12); position: relative;
    transition: transform .08s;
  }
  .swatch:hover { transform: scale(1.08); }
  .swatch.sel { border-color: #fff; box-shadow: 0 0 0 2px var(--accent-strong); }
  .swatch .rm {
    position: absolute; top: -6px; right: -6px; width: 16px; height: 16px;
    background: var(--danger); color: #fff; border-radius: 50%; font-size: 11px;
    line-height: 15px; text-align: center; display: none; cursor: pointer;
  }
  .swatch:hover .rm { display: block; }
  .add-swatch {
    display: flex; align-items: center; justify-content: center;
    width: 28px; height: 28px; border: 2px dashed var(--border); border-radius: 6px;
    color: var(--muted); cursor: pointer; font-size: 18px;
  }
  .add-swatch:hover { color: var(--text); border-color: var(--accent); }

  /* ---- Stitch type picker ---- */
  .stitch-scroll { max-height: 300px; overflow-y: auto; }
  .stitch-cat {
    font-size: 9.5px; text-transform: uppercase; letter-spacing: .5px;
    color: var(--muted); margin: 8px 2px 5px; opacity: .8;
  }
  .stitch-cat:first-child { margin-top: 0; }
  .stitch-grid { display: grid; grid-template-columns: repeat(auto-fill, 62px); gap: 6px; justify-content: start; }
  .stitch-opt {
    width: 62px; display: flex; flex-direction: column; align-items: center; gap: 4px;
    padding: 7px 3px; border: 1px solid var(--border); border-radius: 8px;
    background: var(--panel-2); cursor: pointer; transition: border-color .12s, background .12s;
  }
  .stitch-opt:hover { border-color: var(--accent); }
  .stitch-opt.active { border-color: var(--accent-strong); background: rgba(91,124,255,.15); }
  .stitch-opt canvas { background: var(--fabric); border-radius: 4px; }
  .stitch-opt span { font-size: 9px; color: var(--muted); text-align: center; line-height: 1.1; }
  .stitch-opt.active span { color: var(--text); }

  /* ---- Canvas area ---- */
  main {
    flex: 1; position: relative; overflow: hidden;
    background:
      linear-gradient(45deg, #20222c 25%, transparent 25%),
      linear-gradient(-45deg, #20222c 25%, transparent 25%),
      linear-gradient(45deg, transparent 75%, #20222c 75%),
      linear-gradient(-45deg, transparent 75%, #20222c 75%);
    background-size: 24px 24px;
    background-position: 0 0, 0 12px, 12px -12px, -12px 0px;
    background-color: #1a1c24;
  }
  #stage { position: absolute; inset: 0; overflow: auto; }
  /* ---- Floating view controls (zoom + undo/redo) ---- */
  #viewFab {
    position: absolute; top: 12px; left: 50%; transform: translateX(-50%);
    display: flex; align-items: center; gap: 2px; padding: 4px 6px;
    background: rgba(37,40,51,0.97); border: 1px solid var(--border); border-radius: 12px;
    box-shadow: 0 6px 20px rgba(0,0,0,.35); backdrop-filter: blur(6px); z-index: 30;
  }
  #viewFab button {
    display: flex; align-items: center; justify-content: center;
    width: 30px; height: 30px; border-radius: 8px; border: 1px solid transparent;
    background: transparent; color: #cfd3e0; cursor: pointer; font-size: 16px;
    transition: background .12s, color .12s;
  }
  #viewFab button:hover { background: rgba(255,255,255,.08); color: #fff; }
  #viewFab svg { width: 17px; height: 17px; stroke: currentColor; fill: none; stroke-width: 1.8; stroke-linecap: round; stroke-linejoin: round; }
  #viewFab .zoomval { font-size: 11px; color: var(--muted); min-width: 36px; text-align: center; }
  #viewFab .vsep { width: 1px; height: 20px; background: var(--border); margin: 0 3px; flex: 0 0 auto; }
  #canvasWrap { position: relative; width: max-content; margin: 40px auto; }
  canvas#board {
    display: block; box-shadow: 0 8px 40px rgba(0,0,0,.5);
    border-radius: 4px; cursor: crosshair; touch-action: none;
  }
  .hint {
    position: absolute; bottom: 12px; left: 50%; transform: translateX(-50%);
    background: rgba(20,22,30,.85); backdrop-filter: blur(6px);
    border: 1px solid var(--border); border-radius: 20px;
    padding: 6px 14px; font-size: 12px; color: var(--muted);
    pointer-events: none; white-space: nowrap; max-width: 92%; overflow: hidden; text-overflow: ellipsis;
  }
  .coords {
    position: absolute; top: 10px; right: 14px;
    background: rgba(20,22,30,.85); border: 1px solid var(--border);
    border-radius: 6px; padding: 4px 10px; font-size: 12px; color: var(--muted);
    font-variant-numeric: tabular-nums; pointer-events: none;
  }

  /* ---- Modal ---- */
  .modal-bg {
    position: fixed; inset: 0; background: rgba(0,0,0,.5);
    display: none; align-items: center; justify-content: center; z-index: 50;
  }
  .modal-bg.show { display: flex; }
  .modal {
    background: var(--panel); border: 1px solid var(--border); border-radius: 14px;
    padding: 22px; width: 320px; box-shadow: 0 20px 60px rgba(0,0,0,.5);
  }
  .modal h3 { margin: 0 0 16px; font-size: 16px; }
  .field { margin-bottom: 14px; }
  .field label { display: block; font-size: 12px; color: var(--muted); margin-bottom: 6px; }
  .field input[type=number], .field input[type=text] {
    width: 100%; padding: 8px 10px; background: var(--panel-2);
    border: 1px solid var(--border); border-radius: 8px; color: var(--text); font-size: 14px;
  }
  .field-row { display: flex; gap: 8px; }
  .field-row input { flex: 1; min-width: 0; }
  .projects-list { max-height: 260px; overflow-y: auto; display: flex; flex-direction: column; gap: 6px; margin: 4px 0 16px; }
  .proj-empty { font-size: 12px; color: var(--muted); text-align: center; padding: 16px 0; }
  .proj-row { display: flex; align-items: center; gap: 10px; padding: 6px; border: 1px solid var(--border); border-radius: 8px; background: var(--panel-2); }
  .proj-row img { width: 40px; height: 40px; object-fit: cover; border-radius: 5px; background: var(--fabric); flex: 0 0 auto; }
  .proj-info { flex: 1; min-width: 0; }
  .proj-name { font-size: 12.5px; font-weight: 600; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  .proj-date { font-size: 10.5px; color: var(--muted); }
  .proj-open { height: 28px; padding: 0 10px; border-radius: 6px; border: 1px solid var(--border); background: var(--panel); color: var(--text); cursor: pointer; font-size: 11.5px; flex: 0 0 auto; }
  .proj-open:hover { background: var(--accent-strong); border-color: var(--accent-strong); color: #fff; }
  .proj-del { width: 28px; height: 28px; border-radius: 6px; border: 1px solid transparent; background: transparent; color: var(--danger); cursor: pointer; font-size: 13px; flex: 0 0 auto; }
  .proj-del:hover { background: rgba(255,107,107,0.12); }
  .modal-actions { display: flex; gap: 8px; justify-content: flex-end; margin-top: 8px; }
  .btn-primary {
    padding: 8px 16px; background: var(--accent-strong); color: #fff;
    border: none; border-radius: 8px; cursor: pointer; font-size: 13px; font-weight: 500;
  }
  .btn-ghost {
    padding: 8px 16px; background: transparent; color: var(--text);
    border: 1px solid var(--border); border-radius: 8px; cursor: pointer; font-size: 13px;
  }
  kbd {
    background: var(--panel-2); border: 1px solid var(--border); border-bottom-width: 2px;
    border-radius: 4px; padding: 1px 5px; font-size: 11px; font-family: inherit;
  }
  input[type=file] { display: none; }
  #foldSel, #shapeKind {
    height: 32px; background: var(--panel); color: var(--text);
    border: 1px solid var(--border); border-radius: 7px; padding: 0 6px;
    font-size: 12px; cursor: pointer;
  }
  /* alterna visibilidade por modo */
  body[data-mode="bordado"] [data-for="crochet"],
  body[data-mode="crochet"] [data-for="bordado"] { display: none !important; }
  /* menu de visibilidade (ícone de olho) */
  #visFab { position: absolute; top: 44px; right: 14px; display: flex; flex-direction: column; align-items: flex-end; gap: 6px; z-index: 30; }
  #visToggle {
    width: 34px; height: 34px; border-radius: 50%; cursor: pointer;
    background: rgba(37,40,51,0.9); border: 1px solid var(--border); color: #cfd3e0;
    display: flex; align-items: center; justify-content: center; box-shadow: 0 3px 10px rgba(0,0,0,.35);
  }
  #visToggle svg { width: 19px; height: 19px; stroke: currentColor; fill: none; stroke-width: 1.7; }
  #visToggle:hover { color: #fff; }
  #visToggle.active { background: var(--accent-strong); border-color: var(--accent-strong); color: #fff; }
  #visPanel { display: none; flex-direction: column; gap: 2px; padding: 6px; min-width: 200px;
    background: rgba(37,40,51,0.97); border: 1px solid var(--border); border-radius: 10px; box-shadow: 0 8px 24px rgba(0,0,0,.4); }
  #visPanel.show { display: flex; }
  #visPanel button {
    display: flex; align-items: center; gap: 9px; height: 32px; padding: 0 8px;
    background: transparent; color: var(--text); border: 1px solid transparent; border-radius: 7px;
    cursor: pointer; font-size: 12.5px; text-align: left;
  }
  #visPanel button:hover { background: var(--panel-2); }
  #visPanel button svg { width: 16px; height: 16px; stroke: currentColor; fill: none; stroke-width: 1.7; flex: 0 0 auto; }
  #visPanel button.off { color: var(--muted); }
  /* flyout de formas */
  #shapeFlyout { position: fixed; display: none; gap: 4px; padding: 6px;
    background: rgba(37,40,51,0.98); border: 1px solid var(--border); border-radius: 10px;
    box-shadow: 0 8px 24px rgba(0,0,0,.45); z-index: 70; }
  #shapeFlyout.show { display: flex; }
  #shapeFlyout button {
    width: 34px; height: 34px; border-radius: 8px; cursor: pointer; font-size: 17px;
    background: transparent; border: 1px solid transparent; color: #e6e8ef;
    display: flex; align-items: center; justify-content: center;
  }
  #shapeFlyout button:hover { background: var(--panel-2); }
  #shapeFlyout button.sel { background: var(--accent-strong); color: #fff; }
  /* flyout de formatos de download */
  #downloadFlyout { position: fixed; display: none; flex-direction: column; gap: 2px; padding: 6px;
    background: rgba(37,40,51,0.98); border: 1px solid var(--border); border-radius: 10px;
    box-shadow: 0 8px 24px rgba(0,0,0,.45); z-index: 70; min-width: 150px; }
  #downloadFlyout.show { display: flex; }
  #downloadFlyout button {
    text-align: left; padding: 7px 10px; border-radius: 7px; border: 1px solid transparent;
    background: transparent; color: var(--text); cursor: pointer; font-size: 13px;
  }
  #downloadFlyout button:hover { background: var(--panel-2); }

  .obj-panel {
    position: absolute; left: 12px; bottom: 12px; width: 210px;
    background: rgba(37,40,51,0.97); border: 1px solid var(--border);
    border-radius: 12px; padding: 12px; display: none;
    box-shadow: 0 8px 30px rgba(0,0,0,.4); backdrop-filter: blur(6px);
  }
  .obj-panel.show { display: block; }
  .obj-panel h4 { margin: 0 0 10px; font-size: 12px; color: var(--muted); text-transform: uppercase; letter-spacing: .5px; }
  .op-row { display: flex; align-items: center; gap: 8px; margin-bottom: 9px; }
  .op-row label { font-size: 11px; color: var(--muted); width: 46px; flex: 0 0 auto; }
  .op-row select, .op-row input[type=number] {
    flex: 1; min-width: 0; height: 28px; background: var(--panel-2); color: var(--text);
    border: 1px solid var(--border); border-radius: 6px; padding: 0 6px; font-size: 12px;
  }
  .op-row input[type=range] { flex: 1; min-width: 0; }
  .op-val { font-size: 11px; color: var(--muted); width: 26px; flex: 0 0 auto; text-align: right; font-variant-numeric: tabular-nums; }
  .op-btns { display: flex; gap: 6px; margin-top: 4px; }
  .op-btns button {
    flex: 1; min-width: 0; height: 30px; border-radius: 7px; border: 1px solid var(--border);
    background: var(--panel-2); color: var(--text); cursor: pointer; font-size: 12px; white-space: nowrap;
  }
  .op-btns button:hover { background: var(--panel); }
  .op-btns button.danger { border-color: var(--danger); color: var(--danger); }
  .op-row button.mini { flex: 1; min-width: 0; height: 26px; border-radius: 6px; border: 1px solid var(--border); background: var(--panel-2); color: var(--text); cursor: pointer; font-size: 11px; }
  .op-row button.mini:hover { background: var(--panel); }
  .op-pat { display: flex; flex-wrap: wrap; gap: 4px; margin-bottom: 9px; }
  .pat-chip { display: inline-flex; align-items: center; gap: 4px; background: var(--panel); border: 1px solid var(--border); border-radius: 11px; padding: 2px 7px; font-size: 10px; }
  .pat-chip b { cursor: pointer; color: var(--danger); font-weight: 700; }
  .pat-empty { font-size: 10px; color: var(--muted); }
</style>
</head>
<body>
<div id="app">
  <header>
    <h1><span class="logo">🧵</span><span class="brand">Dotê</span></h1>

    <div class="group seg-toggle" id="modeToggle">
      <button class="seg-btn" data-mode="bordado" title="Modo bordar">🧵 Bordar</button>
      <button class="seg-btn" data-mode="crochet" title="Modo crochê">🧶 Crochê</button>
    </div>

    <div class="spacer"></div>

    <div class="group">
      <button class="plain" id="newBtn" title="Novo projeto">＋ Novo</button>
      <button class="plain" id="clearBtn" title="Limpar tudo">🧹 Limpar</button>
    </div>

    <div class="group">
      <button class="plain icon-only" id="projectsBtn" title="Meus projetos"><svg viewBox="0 0 24 24"><path d="M3 7a2 2 0 012-2h4l2 2h8a2 2 0 012 2v8a2 2 0 01-2 2H5a2 2 0 01-2-2V7z"/></svg></button>
      <button class="plain icon-only" id="importImgBtn" title="Importar imagem"><svg viewBox="0 0 24 24"><path d="M12 19V5"/><path d="M6 11l6-6 6 6"/></svg></button>
      <button class="plain icon-only" id="downloadTrigger" title="Baixar"><svg viewBox="0 0 24 24"><path d="M12 5v14"/><path d="M6 13l6 6 6-6"/></svg></button>
      <input type="file" id="imgInput" accept="image/*">
    </div>
  </header>

  <div id="body">
    <aside>
      <div class="aside-section">
        <h2>Cor atual</h2>
        <div class="current-color">
          <label class="current-swatch" id="currentSwatch" title="Escolher cor (gradiente, pipeta e hex)"><input type="color" id="colorPicker" value="#c0392b"></label>
          <input type="text" id="hexInput" class="hex-input" value="#C0392B" maxlength="7" spellcheck="false">
        </div>
        <div class="bg-row">
          <label class="current-swatch sm" id="bgSwatch" title="Cor de fundo do tecido"><input type="color" id="bgPicker" value="#f3ede0"></label>
          <span class="bg-label">Fundo do tecido</span>
        </div>
        <input type="color" id="addColorPicker" style="display:none">
      </div>
      <div class="aside-section" id="cellSelSection" style="display:none;">
        <h2>Seleção</h2>
        <div id="cellSelBody"></div>
      </div>
      <div class="aside-section palette-section" id="paletteSection">
        <h2>Paleta</h2>
        <div class="swatches" id="swatches"></div>

<script>
"use strict";

// ---------- Stitch types ----------
// mode: "cell" (fills a grid cell) | "line" (segments between grid nodes) | "free" (freehand path)
const STITCH_TYPES = [
  { id: "full",     name: "Ponto cruz",   mode: "cell", cat: "Ponto contado" },
  { id: "half_f",   name: "Meio /",       mode: "cell", cat: "Ponto contado" },
  { id: "half_b",   name: "Meio \\",      mode: "cell", cat: "Ponto contado" },
  { id: "tq_f",     name: "3/4 ponto",    mode: "cell", cat: "Ponto contado" },
  { id: "reto",     name: "Ponto reto",   mode: "cell", cat: "Ponto contado" },
  { id: "knot",     name: "Nó francês",   mode: "cell", cat: "Ponto contado" },
  { id: "cr_chain", name: "Corrente",     mode: "crochet", cat: "Crochê" },
  { id: "cr_chain2",name: "Corrente ∞",   mode: "crochet", cat: "Crochê" },
  { id: "cr_slip",  name: "P. baixíssimo",mode: "crochet", cat: "Crochê" },
  { id: "cr_sc",    name: "Ponto baixo",  mode: "crochet", cat: "Crochê" },
  { id: "cr_hdc",   name: "P. meio alto", mode: "crochet", cat: "Crochê" },
  { id: "cr_dc",    name: "Ponto alto",   mode: "crochet", cat: "Crochê" },
  { id: "cr_tr",    name: "P. alto duplo",mode: "crochet", cat: "Crochê" },
  { id: "cr_dtr",   name: "P. alto triplo",mode:"crochet", cat: "Crochê" },
  { id: "cr_vst",   name: "V (2 juntos)", mode: "crochet", cat: "Crochê" },
  { id: "cr_shell", name: "Leque (shell)",mode: "crochet", cat: "Crochê" },
  { id: "cr_cluster",name:"Cluster",      mode: "crochet", cat: "Crochê" },
  { id: "cr_puff",  name: "Puff/bobble",  mode: "crochet", cat: "Crochê" },
  { id: "cr_popcorn",name:"Popcorn",      mode: "crochet", cat: "Crochê" },
  { id: "cr_fpdc",  name: "Relevo frente",mode: "crochet", cat: "Crochê" },
  { id: "cr_bpdc",  name: "Relevo trás",  mode: "crochet", cat: "Crochê" },
  { id: "cr_picot", name: "Picô",         mode: "crochet", cat: "Crochê" },
  { id: "cr_ring",  name: "Anel mágico",  mode: "crochet", cat: "Crochê" },
  { id: "back",     name: "Ponto atrás",  mode: "line", cat: "Linhas / contorno" },
  { id: "alinhavo", name: "Alinhavo",     mode: "line", cat: "Linhas / contorno" },
  { id: "vagonite", name: "Vagonite",     mode: "line", cat: "Linhas / contorno" },
  { id: "contorno", name: "Contorno",     mode: "line", cat: "Linhas / contorno" },
  { id: "livre",    name: "Ponto livre",  mode: "free", cat: "À mão livre" },
];
function typeInfo(id) { return STITCH_TYPES.find(t => t.id === id); }
function currentMode() { return typeInfo(state.type).mode; }

const DEFAULT_PALETTE = [
  "#c0392b","#e74c3c","#e67e22","#f1c40f","#f9e79f","#2ecc71",
  "#27ae60","#16a085","#1abc9c","#3498db","#2980b9","#8e44ad",
  "#9b59b6","#ec407a","#f8bbd0","#ffffff","#95a5a6","#34495e",
  "#7f5539","#b08968","#000000","#c9a227","#6d4c41","#00897b",
];

// ---------- State ----------
const state = {
  cols: 40,
  rows: 40,
  cells: new Map(),   // "c,r" -> {color, type}
  segs: new Map(),    // "x1,y1,x2,y2" -> {color, type}  (grid-node coords)
  free: [],           // [{color, w, pts:[[fx,fy],...]}]  (cell-fraction coords)
  palette: DEFAULT_PALETTE.slice(),
  color: "#c0392b",
  type: "full",
  tool: "brush",
  cell: 22,
  showGrid: true,
  symCenters: [],      // [{x, y, fold}]  x,y em coords de nó (inteiros)
  showCenters: true,
  fold: 6,             // nº de eixos p/ novos centros
  crochet: [],         // pontos soltos [{type,x,y,angle,scale,color}]  (coords em células)
  shapes: [],          // formas-guia com distribuição vinculada (ver createDraft)
  shapeKind: "circle", // tipo de forma a desenhar
  showShapes: true,    // mostra/oculta os contornos das formas-guia
  mode: "bordado",     // "bordado" | "crochet"
  bg: "#f3ede0",       // cor de fundo do tecido
  image: null,         // {src, x, y, w, h, opacity} imagem de referência (coords em células)
};
const imgEl = new Image();
let imgReady = false;
imgEl.onload = () => { imgReady = true; draw(); };
function loadRefImage(src) { imgReady = false; imgEl.src = src; }
// cores da grade (e furos) automáticas por contraste com o fundo
function gridColors() {
  const n = parseInt((state.bg || "#f3ede0").slice(1), 16);
  const L = 0.299*((n>>16)&255) + 0.587*((n>>8)&255) + 0.114*(n&255);
  return L > 140
    ? { thin:"rgba(0,0,0,0.16)", mid:"rgba(0,0,0,0.38)", bold:"rgba(0,0,0,0.42)", hole:"rgba(60,45,25,0.12)" }
    : { thin:"rgba(255,255,255,0.18)", mid:"rgba(255,255,255,0.42)", bold:"rgba(255,255,255,0.5)", hole:"rgba(255,255,255,0.14)" };
}
const CROCHET_H = 1.5;       // altura base do ponto (em células)
let lastCrochet = false; // tracks crochet<->outros p/ auto-troca grade/guias

const MIN_CELL = 6, MAX_CELL = 60;
const FREE_W = 0.22; // freehand thread thickness in cell fractions

const board = document.getElementById("board");
const ctx = board.getContext("2d");
const stage = document.getElementById("stage");
const coordsEl = document.getElementById("coords");
const hintEl = document.getElementById("hint");

// ---------- Undo / redo ----------
let undoStack = [], redoStack = [], lastPushed = null;
function snapshot() {
  return JSON.stringify({
    cols: state.cols, rows: state.rows,
    cells: [...state.cells.entries()],
    segs: [...state.segs.entries()],
    free: state.free,
    crochet: state.crochet,
    shapes: state.shapes,
    symCenters: state.symCenters,
    image: state.image,
  });
}
function restore(snap) {
  const d = JSON.parse(snap);
  state.cols = d.cols; state.rows = d.rows;
  state.cells = new Map(d.cells);
  state.segs = new Map(d.segs || []);
  state.free = d.free || [];
  state.crochet = d.crochet || [];
  state.shapes = d.shapes || [];
  state.image = d.image || null;
  if (state.image) loadRefImage(state.image.src); else imgReady = false;
  selectedObj = null; selMulti = []; cellSel = new Set(); cellDrag = null; cellMarquee = null; refreshPanel();
  state.symCenters = migrateCenters(d.symCenters);
  selectedCenter = state.symCenters[0] || null; invalidateSym();
  resizeBoard(); draw(); autosave();
}
function pushUndo() {
  const s = snapshot();
  if (s === lastPushed) return;
  undoStack.push(s); lastPushed = s;
  if (undoStack.length > 80) undoStack.shift();
  redoStack.length = 0;
  updateUndoButtons();
}
function undo() {
  if (!undoStack.length) return;
  redoStack.push(snapshot());
  const s = undoStack.pop(); lastPushed = undoStack[undoStack.length-1] ?? null;
  restore(s); updateUndoButtons();
}
function redo() {
  if (!redoStack.length) return;
  undoStack.push(snapshot()); lastPushed = undoStack[undoStack.length-1];
  restore(redoStack.pop()); updateUndoButtons();
}
function updateUndoButtons() {
  document.getElementById("undoBtn").style.opacity = undoStack.length ? 1 : .4;
  document.getElementById("redoBtn").style.opacity = redoStack.length ? 1 : .4;
}

// ---------- Board sizing ----------
function resizeBoard() {
  const cs = state.cell;
  const w = state.cols * cs, h = state.rows * cs;
  const dpr = window.devicePixelRatio || 1;
  board.width = w * dpr; board.height = h * dpr;
  board.style.width = w + "px"; board.style.height = h + "px";
  ctx.setTransform(dpr, 0, 0, dpr, 0, 0);
}

// ---------- Color helpers ----------
function shade(hex, amt) {
  const n = parseInt(hex.slice(1), 16);
  let r = (n >> 16) & 255, g = (n >> 8) & 255, b = n & 255;
  r = Math.max(0, Math.min(255, Math.round(r + amt)));
  g = Math.max(0, Math.min(255, Math.round(g + amt)));
  b = Math.max(0, Math.min(255, Math.round(b + amt)));
  return "rgb(" + r + "," + g + "," + b + ")";
}

// ---------- Yarn strand (used by cell + free) ----------
function strand(g, ax, ay, bx, by, color, lw) {
  g.lineCap = "round";
  g.strokeStyle = shade(color, -45); g.lineWidth = lw;
  g.beginPath(); g.moveTo(ax + lw*0.18, ay + lw*0.18); g.lineTo(bx + lw*0.18, by + lw*0.18); g.stroke();
  g.strokeStyle = color; g.lineWidth = lw;
  g.beginPath(); g.moveTo(ax, ay); g.lineTo(bx, by); g.stroke();
  g.strokeStyle = shade(color, 55); g.lineWidth = lw * 0.34;
  g.beginPath(); g.moveTo(ax - lw*0.16, ay - lw*0.16); g.lineTo(bx - lw*0.16, by - lw*0.16); g.stroke();
}

// ---------- Cell stitch drawing ----------
function drawCellStitch(g, x, y, cs, color, type) {
  if (type.startsWith("cr_")) { drawCrochet(g, x, y, cs, color, type); return; }
  const pad = cs * 0.13;
  const x0 = x + pad, y0 = y + pad, x1 = x + cs - pad, y1 = y + cs - pad;
  const lw = Math.max(1.4, cs * 0.16);

  if (type === "full") {
    strand(g, x0, y1, x1, y0, color, lw);
    strand(g, x0, y0, x1, y1, color, lw);
  } else if (type === "half_f") {
    strand(g, x0, y1, x1, y0, color, lw);
  } else if (type === "half_b") {
    strand(g, x0, y0, x1, y1, color, lw);
  } else if (type === "tq_f") {
    strand(g, x0, y1, x1, y0, color, lw);
    strand(g, x1, y1, x + cs/2, y + cs/2, color, lw);
  } else if (type === "reto") {
    strand(g, x + cs/2, y0, x + cs/2, y1, color, lw * 1.05);
  } else if (type === "knot") {
    const cx = x + cs/2, cy = y + cs/2, r = cs*0.22;
    g.fillStyle = shade(color, -40);
    g.beginPath(); g.arc(cx + r*0.15, cy + r*0.15, r, 0, Math.PI*2); g.fill();
    g.fillStyle = color;
    g.beginPath(); g.arc(cx, cy, r, 0, Math.PI*2); g.fill();
    g.fillStyle = shade(color, 60);
    g.beginPath(); g.arc(cx - r*0.3, cy - r*0.3, r*0.4, 0, Math.PI*2); g.fill();
  }
}

// ---------- Crochet chart symbols (cell mode) ----------
function drawCrochet(g, x, y, cs, color, type) {
  const cx = x + cs/2, cy = y + cs/2;
  const pad = cs * 0.18;
  const lw = Math.max(1.5, cs * 0.11);
  g.strokeStyle = color; g.fillStyle = color;
  g.lineWidth = lw; g.lineCap = "round"; g.lineJoin = "round"; g.setLineDash([]);

  if (type === "cr_chain") {                 // corrente: oval
    g.beginPath(); g.ellipse(cx, cy, cs*0.34, cs*0.17, 0, 0, Math.PI*2); g.stroke();
  } else if (type === "cr_slip") {           // ponto baixíssimo: ponto cheio
    g.beginPath(); g.arc(cx, cy, cs*0.13, 0, Math.PI*2); g.fill();
  } else if (type === "cr_ring") {           // anel mágico: círculo aberto
    g.lineWidth = lw * 1.2;
    g.beginPath(); g.arc(cx, cy, cs*0.34, 0, Math.PI*2); g.stroke();
  } else if (type === "cr_sc") {             // ponto baixo: cruz "+"
    g.beginPath();
    g.moveTo(cx, y + pad); g.lineTo(cx, y + cs - pad);
    g.moveTo(x + pad, cy); g.lineTo(x + cs - pad, cy);
    g.stroke();
  } else {
    // hastes verticais com topo em "T" (meio alto, alto, alto duplo)
    const top = y + pad, bot = y + cs - pad, halfW = cs * 0.20;
    g.beginPath();
    g.moveTo(cx, top); g.lineTo(cx, bot);                 // haste
    g.moveTo(cx - halfW, top); g.lineTo(cx + halfW, top); // topo
    g.stroke();
    const slashes = type === "cr_hdc" ? 0 : (type === "cr_dc" ? 1 : 2);
    for (let i = 0; i < slashes; i++) {
      const yy = cy - (slashes-1)*cs*0.11/2 + i*cs*0.16;
      g.beginPath();
      g.moveTo(cx - halfW*0.9, yy + cs*0.07);
      g.lineTo(cx + halfW*0.9, yy - cs*0.07);
      g.stroke();
    }
  }
}

// ---------- Crochet symbols ----------
// desenha o símbolo com a BASE na origem (0,0) crescendo p/ cima (-y). h = altura em px.
function drawCrochetSymbol(g, h, color, type) {
  const w = h * 0.6, lw = Math.max(1.5, h * 0.075);
  g.strokeStyle = color; g.fillStyle = color;
  g.lineWidth = lw; g.lineCap = "round"; g.lineJoin = "round"; g.setLineDash([]);

  if (type === "cr_chain") {                 // corrente: oval
    g.beginPath(); g.ellipse(0, -h*0.5, w*0.55, h*0.3, 0, 0, Math.PI*2); g.stroke();
  } else if (type === "cr_chain2") {         // corrente dupla ∞: dois ovais
    g.beginPath(); g.ellipse(0, -h*0.3, w*0.5, h*0.22, 0, 0, Math.PI*2); g.stroke();
    g.beginPath(); g.ellipse(0, -h*0.72, w*0.5, h*0.22, 0, 0, Math.PI*2); g.stroke();
  } else if (type === "cr_slip") {           // ponto baixíssimo: ponto cheio
    g.beginPath(); g.arc(0, -h*0.28, w*0.34, 0, Math.PI*2); g.fill();
  } else if (type === "cr_ring") {           // anel mágico: círculo
    g.lineWidth = lw * 1.3;
    g.beginPath(); g.arc(0, -h*0.5, h*0.5, 0, Math.PI*2); g.stroke();
  } else if (type === "cr_sc") {             // ponto baixo: cruz "+"
    const cy = -h*0.5;
    g.beginPath();
    g.moveTo(0, cy - h*0.32); g.lineTo(0, cy + h*0.32);
    g.moveTo(-w*0.45, cy); g.lineTo(w*0.45, cy);
    g.stroke();
  } else if (type === "cr_vst") {            // V: 2 pontos saindo da mesma base
    g.beginPath();
    g.moveTo(0, 0); g.lineTo(-w*0.6, -h);
    g.moveTo(0, 0); g.lineTo(w*0.6, -h);
    g.moveTo(-w*0.55, -h); g.lineTo(-w*0.35, -h);      // topinhos
    g.moveTo(w*0.35, -h); g.lineTo(w*0.55, -h);
    g.stroke();
  } else if (type === "cr_shell") {          // leque/shell: várias hastes abrindo p/ cima
    const n = 5;
    g.beginPath();
    for (let i = 0; i < n; i++) {
      const sx = (i/(n-1) - 0.5) * 2 * w * 0.9;
      g.moveTo(0, 0); g.lineTo(sx, -h);
    }
    g.stroke();
  } else if (type === "cr_cluster") {        // cluster: hastes juntas no topo, abertas na base
    const n = 3;
    g.beginPath();
    for (let i = 0; i < n; i++) {
      const bx = (i/(n-1) - 0.5) * 2 * w * 0.55;
      g.moveTo(0, -h); g.lineTo(bx, 0);
    }
    g.moveTo(-w*0.28, -h); g.lineTo(w*0.28, -h);        // topo unido
    g.stroke();
  } else if (type === "cr_puff") {           // puff/bobble: oval com risquinhos

// ---------- Coord helpers ----------

  }

    if (Math.hypot(p.fx-last[0], p.fy-last[1]) > 0.05) {
      currentFree.pts.push([p.fx, p.fy]); draw(); autosave();
    }
  }
}

function pointerUp() {
  if (!pointerOnBoard) return;   // ignora releases de cliques fora do canvas (ex: botões do painel)
  pointerOnBoard = false;
  if (panActive) {
    panActive = false;
    board.style.cursor = (state.tool === "pan" || spaceDown) ? "grab" : "crosshair";
    return;
  }
  if (preview) { commitPreview(); preview = null; draw(); autosave(); }
  if (currentFree) {
    if (currentFree.pts.length >= 1) state.free.push(currentFree);
    currentFree = null; draw(); autosave();
  }
  if (shapeDraft) {
    state.shapes.push(shapeDraft);
    selectedObj = { kind:"shape", ref: shapeDraft };
    shapeDraft = null; shapeStart = null;
    setTool("select"); refreshPanel(); draw(); autosave();
  }
  if (selDrag && selDrag.mode === "marquee") {
    const x0 = Math.min(selDrag.x0, selDrag.x1), x1 = Math.max(selDrag.x0, selDrag.x1);
    const y0 = Math.min(selDrag.y0, selDrag.y1), y1 = Math.max(selDrag.y0, selDrag.y1);
    if (Math.hypot(x1-x0, y1-y0) > 0.3) {
      // formas tocadas pelo retângulo viram pontos soltos e entram na seleção
      let baked = false;
      for (const s of [...state.shapes])
        if (shapeStitches(s).some(p => p.x>=x0 && p.x<=x1 && p.y>=y0 && p.y<=y1)) { if (!baked) { pushUndo(); baked = true; } bakeShape(s); }
      selMulti = state.crochet.filter(s => s.x>=x0 && s.x<=x1 && s.y>=y0 && s.y<=y1);
    }
    marquee = null;
  }
  if (cellMarquee) {
    const x0 = Math.min(cellMarquee.x0, cellMarquee.x1), x1 = Math.max(cellMarquee.x0, cellMarquee.x1);
    const y0 = Math.min(cellMarquee.y0, cellMarquee.y1), y1 = Math.max(cellMarquee.y0, cellMarquee.y1);
    if (Math.hypot(x1-x0, y1-y0) > 0.15) {
      const found = new Set();
      for (const key of state.cells.keys()) {
        const [c, r] = key.split(",").map(Number);
        if (c+1>x0 && c<x1 && r+1>y0 && r<y1) found.add(key);
      }
      cellSel = found;
    }
    cellMarquee = null;
  }
  cellDrag = null;
  drawing = false; lastCell = null; lastNode = null; lastLoose = null; draggingCenter = null; selDrag = null;
  if (state.tool === "select") refreshPanel();
}

function commitPreview() {
  const a = preview.a, b = preview.b;
  if (preview.type === "line") {
    plotLine(a.c, a.r, b.c, b.r, (c, r) => applyBrush(c, r));
  } else if (preview.type === "rect") {
    const c0 = Math.min(a.c,b.c), c1 = Math.max(a.c,b.c), r0 = Math.min(a.r,b.r), r1 = Math.max(a.r,b.r);
    for (let c = c0; c <= c1; c++) { applyBrush(c, r0); applyBrush(c, r1); }
    for (let r = r0; r <= r1; r++) { applyBrush(c0, r); applyBrush(c1, r); }
  }
}
function drawPreview() {
  const cs = state.cell;
  ctx.save(); ctx.globalAlpha = 0.55;
  const paint = (c, r) => { if (inBounds(c,r)) drawCellStitch(ctx, c*cs, r*cs, cs, state.color, state.type); };
  if (preview.type === "line") plotLine(preview.a.c, preview.a.r, preview.b.c, preview.b.r, paint);
  else if (preview.type === "rect") {
    const a = preview.a, b = preview.b;
    const c0 = Math.min(a.c,b.c), c1 = Math.max(a.c,b.c), r0 = Math.min(a.r,b.r), r1 = Math.max(a.r,b.r);
    for (let c=c0;c<=c1;c++){ paint(c,r0); paint(c,r1); }
    for (let r=r0;r<=r1;r++){ paint(c0,r); paint(c1,r); }
  }
  ctx.restore();
}

// Bresenham over cells
function plotLine(c0, r0, c1, r1, fn) {
  let dx = Math.abs(c1-c0), dy = -Math.abs(r1-r0);
  let sx = c0 < c1 ? 1 : -1, sy = r0 < r1 ? 1 : -1, err = dx + dy;
  while (true) {
    fn(c0, r0);
    if (c0 === c1 && r0 === r1) break;
    const e2 = 2*err;
    if (e2 >= dy) { err += dy; c0 += sx; }
    if (e2 <= dx) { err += dx; r0 += sy; }
  }
}

function mirrorGroup(axis) {

let clip = null;

    clip = { kind:"cells", data };

  }
  if (selMulti.length) { clip = { kind:"group", data: selMulti.map(s => JSON.parse(JSON.stringify(s))) }; return true; }
  if (!selectedObj || selectedObj.kind === "image") return false;

function pasteClip() {

      const c = d.c+off, r = d.r+off;
      if (!inBounds(c, r)) continue;
      const k = c+","+r;

    }

  } else if (clip.kind === "group") {
    const news = clip.data.map(d => { const c = JSON.parse(JSON.stringify(d)); c.x += 1.5; c.y += 1.5; state.crochet.push(c); return c; });
    selMulti = news; selectedObj = null;
  } else {
    const c = JSON.parse(JSON.stringify(clip.data));
    if (clip.kind === "shape") { c.id = shapeSeq++; moveShape(c, 1.5, 1.5); state.shapes.push(c); selectedObj = { kind:"shape", ref: c }; }
    else { c.x += 1.5; c.y += 1.5; state.crochet.push(c); selectedObj = { kind:"stitch", ref: c }; }
    selMulti = [];
  }
  if (state.tool !== "select") setTool("select");
  refreshPanel(); draw(); autosave();
  return true;
}
function deleteSelected() {
  if (cellSel.size) {
    pushUndo();
    for (const key of cellSel) state.cells.delete(key);
    cellSel = new Set(); refreshPanel(); draw(); autosave(); return;
  }
  if (selMulti.length) {
    pushUndo();
    const set = new Set(selMulti);
    state.crochet = state.crochet.filter(s => !set.has(s));
    selMulti = []; refreshPanel(); draw(); autosave(); return;
  }
  if (!selectedObj) return;
  pushUndo();
  if (selectedObj.kind === "shape") { const i = state.shapes.indexOf(selectedObj.ref); if (i>=0) state.shapes.splice(i,1); }
  else if (selectedObj.kind === "image") { state.image = null; }
  else { const i = state.crochet.indexOf(selectedObj.ref); if (i>=0) state.crochet.splice(i,1); }
  selectedObj = null; refreshPanel(); draw(); autosave();
}

  const col = "#c0392b";
  if (st.mode === "cell") {
    drawCellStitch(g, 2, 2, 30, col, st.id);
  } else if (st.mode === "line") {
    drawLineSeg(g, 5, 25, 29, 9, 30, col, st.id);
  } else if (st.mode === "crochet") {
    g.save(); g.translate(17, 30); drawCrochetSymbol(g, 26, col, st.id); g.restore();
  } else { // free
    const stroke = { color: col, w: 0.22, pts: [[0.2,0.75],[0.4,0.3],[0.6,0.7],[0.82,0.3]] };
    drawFreeStroke(g, stroke, 34);

  return cv;
}

// ---------- Exportar / baixar ----------
function renderExportCanvas(includeGrid) {
  if (includeGrid == null) includeGrid = state.showGrid;
  const scale = 20;
  const off = document.createElement("canvas");
  off.width = state.cols * scale; off.height = state.rows * scale;
  const g = off.getContext("2d");
  const gc = gridColors();
  g.fillStyle = state.bg; g.fillRect(0,0,off.width,off.height);
  if (state.image && imgReady) {
    g.save(); g.globalAlpha = state.image.opacity!=null?state.image.opacity:1;
    g.drawImage(imgEl, state.image.x*scale, state.image.y*scale, state.image.w*scale, state.image.h*scale); g.restore();
  }
  if (includeGrid) {
    g.lineWidth = 1;
    for (let c=0;c<=state.cols;c++){ g.strokeStyle = c%10===0?gc.bold:gc.thin;
      g.beginPath(); g.moveTo(c*scale+.5,0); g.lineTo(c*scale+.5,off.height); g.stroke(); }
    for (let r=0;r<=state.rows;r++){ g.strokeStyle = r%10===0?gc.bold:gc.thin;
      g.beginPath(); g.moveTo(0,r*scale+.5); g.lineTo(off.width,r*scale+.5); g.stroke(); }
  }
  for (const [key,val] of state.cells){ const [c,r]=key.split(",").map(Number);
    drawCellRotated(g, c, r, scale, val); }
  for (const [key,val] of state.segs){ const [x1,y1,x2,y2]=key.split(",").map(Number);
    drawLineSeg(g, x1*scale, y1*scale, x2*scale, y2*scale, scale, val.color, val.type); }
  for (const s of state.free) drawFreeStroke(g, s, scale);
  for (const s of state.shapes) {
    const has = (s.pattern && s.pattern.length) || (s.stitch && s.stitch !== "none");
    if (has) shapeStitches(s).forEach((p, i) => { const ty = patternType(s, i); if (!ty || ty === "none") return;
      drawCrochetStamp(g, { type: ty, x:p.x, y:p.y, angle:p.angle, scale:s.scale, color:s.color, lean:s.lean }, scale); });
  }
  for (const st of state.crochet) drawCrochetStamp(g, st, scale);
  return off;
}

// ---------- Keyboard ----------
window.addEventListener("keydown", (e) => {
  if (e.target.tagName === "INPUT") return;
  const meta = e.metaKey || e.ctrlKey;
  if (meta && e.key.toLowerCase() === "z") { e.preventDefault(); e.shiftKey ? redo() : undo(); return; }
  if (meta && e.key.toLowerCase() === "y") { e.preventDefault(); redo(); return; }
  if (meta && e.key.toLowerCase() === "c") { if (copySelected()) e.preventDefault(); return; }
  if (meta && e.key.toLowerCase() === "x") { if (copySelected()) { e.preventDefault(); deleteSelected(); } return; }
  if (meta && e.key.toLowerCase() === "v") { if (pasteClip()) e.preventDefault(); return; }
  if (meta && e.key.toLowerCase() === "d") { if (copySelected() && pasteClip()) e.preventDefault(); return; }
  if (e.code === "Space") { spaceDown = true; board.style.cursor = "grab"; e.preventDefault(); return; }
  if ((e.key === "Delete" || e.key === "Backspace") && state.tool === "select" && (selectedObj || selMulti.length || cellSel.size)) { e.preventDefault(); deleteSelected(); return; }
  if (e.key === "Escape" && (selectedObj || selMulti.length || cellSel.size)) { selectedObj = null; selMulti = []; cellSel = new Set(); refreshPanel(); draw(); return; }
  const map = { b:"brush", e:"erase", g:"fill", v:"select", h:"pan" };
  const t = map[e.key.toLowerCase()];
  if (t) {
    const allowed = state.mode === "crochet" ? ["shape","stitch","select","erase","pan"] : ["brush","erase","fill","pan","select"];
    if (!allowed.includes(t)) return;
    if (["fill","line","rect"].includes(t) && currentMode() !== "cell") return;
    setTool(t);
  }
  if (e.key === "+" || e.key === "=") setZoom(state.cell + 3);
  if (e.key === "-") setZoom(state.cell - 3);
});
window.addEventListener("keyup", (e) => {
  if (e.code === "Space") { spaceDown = false; board.style.cursor = (state.tool === "pan") ? "grab" : "crosshair"; }
});
stage.addEventListener("wheel", (e) => {
  if (e.ctrlKey || e.metaKey) { e.preventDefault(); setZoom(state.cell + (e.deltaY < 0 ? 3 : -3)); }
}, { passive: false });

// ---------- Pointer events ----------
board.addEventListener("pointerdown", (e) => { pointerOnBoard = true; board.setPointerCapture(e.pointerId); pointerDown(e); });
board.addEventListener("pointermove", pointerMove);
window.addEventListener("pointerup", pointerUp);
board.addEventListener("contextmenu", (e) => e.preventDefault());

// ---------- Barra lateral ajustável ----------
(function () {
  const aside = document.querySelector("aside"), rez = document.getElementById("asideResizer");
  let drag = false;
  rez.addEventListener("pointerdown", e => { drag = true; rez.setPointerCapture(e.pointerId); e.preventDefault(); });
  window.addEventListener("pointermove", e => {
    if (!drag) return;
    let w = e.clientX - aside.getBoundingClientRect().left;
    w = Math.max(150, Math.min(480, w));
    aside.style.width = w + "px"; draw();
  });
  window.addEventListener("pointerup", () => { if (drag) { drag = false; try { localStorage.setItem("pontocruz.asideW", aside.style.width); } catch(e){} } });
})();
(function () {
  const sec = document.getElementById("paletteSection"), rez = document.getElementById("paletteResizer");
  let drag = false, sy = 0, sh = 0;
  rez.addEventListener("pointerdown", e => { drag = true; sy = e.clientY; sh = sec.getBoundingClientRect().height; rez.setPointerCapture(e.pointerId); e.preventDefault(); });
  window.addEventListener("pointermove", e => {
    if (!drag) return;
    let h = sh + (e.clientY - sy); h = Math.max(58, Math.min(460, h));
    sec.style.height = h + "px";
  });
  window.addEventListener("pointerup", () => { if (drag) { drag = false; try { localStorage.setItem("pontocruz.paletteH", sec.style.height); } catch(e){} } });
})();
function applySavedLayout() {
  try {
    const w = localStorage.getItem("pontocruz.asideW"); if (w) document.querySelector("aside").style.width = w;
    const h = localStorage.getItem("pontocruz.paletteH"); if (h) document.getElementById("paletteSection").style.height = h;
  } catch(e) {}
}

// ---------- Init ----------
const RESET_TOKEN = "2026-08-22-centro-unico"; // limpeza única: deixa só 1 centro no meio
function init() {
  loadAutosave();
  // reset one-shot: descarta o monte de centros e deixa só um no centro do desenho
  try {
    if (localStorage.getItem("pontocruz.reset") !== RESET_TOKEN) {
      state.symCenters = [{ x: Math.round(state.cols/2), y: Math.round(state.rows/2), spokes: state.fold, hidden: false }];
      selectedCenter = state.symCenters[0];
      localStorage.setItem("pontocruz.reset", RESET_TOKEN);
      autosave();
    }
  } catch (e) {}
  renderSwatches();
  setColor(state.color);
  document.getElementById("bgPicker").value = state.bg;
  document.getElementById("bgSwatch").style.background = state.bg;
  refreshVisPanel();
  document.body.dataset.mode = state.mode;
  document.querySelectorAll("#modeToggle .seg-btn").forEach(b => b.classList.toggle("active", b.dataset.mode === state.mode));
  renderStitchPicker();
  setType(state.type);
  setTool(state.tool);
  refreshPanel();
  applySavedLayout();
  resizeBoard(); draw(); fitZoom();
  updateUndoButtons();
}
window.addEventListener("resize", draw);
init();
</script>
</body>
</html>
